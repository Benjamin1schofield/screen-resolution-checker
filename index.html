<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen Resolution Checker</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:25px}
main{max-width:550px;margin:auto;background:white;padding:25px;border-radius:15px}
.info{background:#cffafe;padding:15px;margin:12px 0;border-radius:8px}
strong{color:#0e7490}
</style>
</head>
<body>
<main>
<h1>Screen Resolution Checker</h1>
<p>Live information about your current browser window.</p>
<div class="info">Screen Width: <strong id="sw"></strong> px</div>
<div class="info">Screen Height: <strong id="sh"></strong> px</div>
<div class="info">Window Width: <strong id="ww"></strong> px</div>
<div class="info">Window Height: <strong id="wh"></strong> px</div>
<div class="info">Pixel Ratio: <strong id="ratio"></strong></div>
<div class="info">Orientation: <strong id="orientation"></strong></div>
<p id="device"></p>
</main>
<script>
function update(){
 document.getElementById("sw").textContent=screen.width;
 document.getElementById("sh").textContent=screen.height;
 document.getElementById("ww").textContent=window.innerWidth;
 document.getElementById("wh").textContent=window.innerHeight;
 document.getElementById("ratio").textContent=window.devicePixelRatio;
 document.getElementById("orientation").textContent=
 window.innerWidth>window.innerHeight?"Landscape":"Portrait";
 document.getElementById("device").textContent=
 "Viewport information updates automatically when the window is resized.";
}
window.addEventListener("resize",update);
update();
</script>
</body>
</html>
